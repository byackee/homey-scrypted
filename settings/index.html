<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; flex: none; }
    .dot.on { background: #2ea043; }
    .dot.off { background: #d1242f; }
    .hint { font-size: 12px; color: #6b7280; margin: 6px 0 0; }
    .message { font-size: 13px; min-height: 18px; margin-top: 12px; }
    .message.error { color: #b91c1c; }
    .message.ok { color: #1a7f37; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title"></h1>
    <p class="homey-subtitle" data-i18n="settings.subtitle"></p>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">…</span>
  </div>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.server"></legend>

    <div class="homey-form-group">
      <label class="homey-form-label" for="host" data-i18n="pair.server.host"></label>
      <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.50"
        autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="port" data-i18n="pair.server.port"></label>
      <input class="homey-form-input" id="port" type="number" value="10443" min="1" max="65535" />
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="username" data-i18n="pair.server.username"></label>
      <input class="homey-form-input" id="username" type="text"
        autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="password" data-i18n="pair.server.password"></label>
      <input class="homey-form-input" id="password" type="password" />
      <p class="hint" data-i18n="settings.password_unchanged"></p>
    </div>
  </fieldset>

  <button class="homey-button-primary-full" id="save" data-i18n="settings.save"></button>
  <p class="message" id="message"></p>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const $ = id => document.getElementById(id);
      const message = $('message');

      // How long the page keeps asking after a save, and how often. The connection is made
      // in the background — saving no longer waits for it — so the page has to come back for
      // the result rather than be handed it.
      //
      // The window has to outlast the app's own connect deadline of 60s. A wrong address is
      // the likeliest reason to be on this page, and it produces no failure at all until
      // that deadline expires: a shorter window gives up seconds before the answer arrives
      // and sends the user to the diagnostics for what the page was about to be told.
      const POLL_INTERVAL_MS = 3000;
      const POLL_WINDOW_MS = 75000;
      let pollTimer = null;
      // Which round of polling is current. A request already in flight cannot be recalled,
      // so it is allowed to return and then ignored — without this, an answer from before
      // the last Save writes its verdict over the one that replaced it.
      let generation = 0;

      function setMessage(text, kind) {
        message.textContent = text || '';
        message.className = 'message' + (kind ? ' ' + kind : '');
      }

      /**
       * Whatever the API gave us, as something readable.
       *
       * An error crossing the settings bridge is not always an Error: it arrives as a plain
       * object, and sometimes as a string. `String(err)` on the object yields "[object
       * Object]", which is no better than silence.
       */
      function errorText(err) {
        if (!err) return '';
        if (typeof err === 'string') return err;
        try {
          return err.message || err.error || JSON.stringify(err);
        } catch (nope) {
          // `JSON.stringify` throws on a circular object, and this runs inside the API
          // callback: an exception here escapes and leaves the page silent, which is the
          // one thing this function exists to prevent.
          return String(err.message || 'The app reported an error it could not describe.');
        }
      }

      /**
       * Draws the connection state, and survives being given nothing.
       *
       * The API answers with no result at all when the app is not running — which is exactly
       * when someone opens this page. Reading `connected` straight off that is what replaced
       * every real fault with "Cannot read properties of undefined (reading 'connected')".
       */
      function renderStatus(status) {
        if (!status) {
          $('dot').className = 'dot off';
          $('statusText').textContent = Homey.__('settings.no_answer');
          return null;
        }

        const connecting = !status.connected && status.connecting;
        $('dot').className = 'dot' + (status.connected ? ' on' : connecting ? '' : ' off');
        $('statusText').textContent = status.connected
          ? Homey.__('settings.connected', { version: status.serverVersion || '?' })
          : connecting
            ? Homey.__('settings.connecting')
            : Homey.__('settings.disconnected');
        return status;
      }

      function loadStatus(done) {
        Homey.api('GET', '/status', null, (err, result) => {
          if (err) {
            renderStatus(null);
            setMessage(errorText(err), 'error');
            return done(null);
          }
          done(renderStatus(result));
        });
      }

      function stopPolling() {
        if (pollTimer) clearTimeout(pollTimer);
        pollTimer = null;
        generation += 1;
      }

      function poll(deadline, round) {
        // Checked before scheduling as well as after answering: a save that lands while an
        // earlier request is still out would otherwise let that request arm a second chain,
        // and the two would write over each other's verdict.
        if (round !== generation) return;

        pollTimer = setTimeout(() => {
          pollTimer = null;
          loadStatus(status => {
            if (round !== generation) return;
            if (!status) return;
            if (status.connected) return setMessage(Homey.__('settings.saved'), 'ok');

            // The reason the hub recorded, which is the one thing worth reporting here. It
            // is cleared when new details are saved, so it can only describe this attempt.
            // Shown, but not treated as the end of the story: the hub retries on its own
            // backoff, and a server that was restarting connects a few seconds later. A page
            // that stopped at the first failure would keep a red message on screen for a
            // configuration that has since started working.
            if (status.lastError) setMessage(status.lastError.reason, 'error');

            if (Date.now() < deadline) return poll(deadline, round);
            if (!status.lastError) setMessage(Homey.__('settings.still_connecting'), 'error');
          });
        }, POLL_INTERVAL_MS);
      }

      loadStatus(status => {
        if (!status) return;
        if (status.config) {
          $('host').value = status.config.host || '';
          $('port').value = status.config.port || 10443;
          $('username').value = status.config.username || '';
        }
        if (!status.connected && !status.connecting && status.lastError) {
          setMessage(status.lastError.reason, 'error');
        }
      });

      $('save').addEventListener('click', () => {
        setMessage('');
        // Ends whatever was being watched and claims the round that replaces it. Captured
        // here rather than read when the answer arrives, so that a second save while this
        // one is in flight retires this one rather than being joined by it.
        stopPolling();
        const round = generation;
        $('save').disabled = true;

        Homey.api('PUT', '/config', {
          host: $('host').value,
          port: Number($('port').value),
          username: $('username').value,
          password: $('password').value,
        }, (err, result) => {
          $('save').disabled = false;
          if (err) return setMessage(errorText(err), 'error');

          const status = renderStatus(result);
          if (!status) return setMessage(Homey.__('settings.no_answer'), 'error');
          if (status.connected) return setMessage(Homey.__('settings.saved'), 'ok');

          // A failure already recorded within the grace period is shown at once, and the
          // page keeps watching anyway: the attempt that failed is not the last one the hub
          // will make.
          setMessage(
            status.lastError ? status.lastError.reason : Homey.__('settings.saved_connecting'),
            status.lastError ? 'error' : '');
          poll(Date.now() + POLL_WINDOW_MS, round);
        });
      });

      Homey.ready();
    }
  </script>
</body>
</html>
