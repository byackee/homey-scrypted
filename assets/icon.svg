<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!--
    The Scrypted mark, drawn as line art on the full canvas.

    Guideline 1.5 requires a vector icon with a transparent background and no fill,
    gradient or background colour, so the purple disc of the original logo is deliberately
    absent: a filled illustration renders as a solid blob at small sizes and is rejected.
  -->
