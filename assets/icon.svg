    <rect x="218" y="218" width="524" height="524" rx="64" />
    <rect x="392" y="392" width="176" height="176" rx="24" />
    <path d="M392 104v114M568 104v114" />
    <path d="M392 742v114M568 742v114" />
    <path d="M104 392h114M104 568h114" />
    <path d="M742 392h114M742 568h114" />
  </g>
</svg>
