<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!--
    The Scrypted mark, drawn as line art on the full canvas.

    Stroke is 40, the weight Homey uses on 248 of the paths in its own device icon set;
    nothing there comes near the 76 this carried before, which closed the inner square
    into a blob at the size the app list renders.

    Guideline 1.5 requires a vector icon with a transparent background and no fill,
    gradient or background colour, so the purple disc of the original logo is deliberately
    absent: a filled illustration renders as a solid blob at small sizes and is rejected.
  -->
  <g fill="none" stroke="#000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <rect x="180.4" y="180.4" width="599.2" height="599.2" rx="73.2" />
    <rect x="379.4" y="379.4" width="201.3" height="201.3" rx="27.4" />
    <path d="M379.4 50v130.4M580.6 50v130.4" />
    <path d="M379.4 779.6v130.4M580.6 779.6v130.4" />
    <path d="M50 379.4h130.4M50 580.6h130.4" />
    <path d="M779.6 379.4h130.4M779.6 580.6h130.4" />
  </g>
</svg>
