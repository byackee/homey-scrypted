<!--
  Source of truth for the "configure" pairing view.

  Homey Compose has no shared-pair-view mechanism, so this file is copied into every
  driver's pair/ folder by tools/build-pair-views.mjs (run via `npm run build`). Edit this
  file, never the generated copies.
-->
<style>
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .field input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 15px;
    border: 1px solid #d5d8dd; border-radius: 8px; }
  .field input:focus { outline: none; border-color: #1f6feb; }
  .row { display: flex; gap: 10px; }
  .row .field:first-child { flex: 3; }
  .row .field:last-child { flex: 1; }
  .hint { font-size: 12px; line-height: 1.45; color: #6b7280; margin: 0 0 18px; }
  .error { color: #b91c1c; font-size: 13px; margin-bottom: 12px; min-height: 18px; }
  button { width: 100%; padding: 11px; font-size: 15px; font-weight: 600; color: #fff;
    background: #1f6feb; border: 0; border-radius: 8px; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
</style>

<p class="hint" data-i18n="pair.server.hint"></p>

<div class="row">
  <div class="field">
    <label for="host" data-i18n="pair.server.host"></label>
    <input id="host" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
      placeholder="192.168.1.50" />
  </div>
  <div class="field">
    <label for="port" data-i18n="pair.server.port"></label>
    <input id="port" type="number" value="10443" min="1" max="65535" />
  </div>
</div>

<div class="field">
  <label for="username" data-i18n="pair.server.username"></label>
  <input id="username" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" />
</div>

<div class="field">
  <label for="password" data-i18n="pair.server.password"></label>
  <input id="password" type="password" />
</div>

<div class="error" id="error"></div>
<button id="connect" data-i18n="pair.server.connect"></button>

<script type="application/javascript">
  /*
   * This view is used for repair only.
   *
   * Pairing goes straight to the device list: a custom view followed by a system template
   * could not be navigated into — both Homey.showView() and Homey.nextView() failed inside
   * Homey's pairing frontend with "null is not an object (evaluating '$(otherView).html')",
   * leaving the screen blank. The server is configured from the app's settings page instead.
   */
  const $ = id => document.getElementById(id);
  const errorEl = $('error');
  const button = $('connect');

  // Cheap insurance: a script error in a pairing view is otherwise invisible, since a
  // CLI-installed app has no readable log. The driver records these into /diagnostics.
  function report(message) {
    try { Homey.emit('viewLog', String(message)); } catch (err) { /* nothing we can do */ }
  }
  window.addEventListener('error', event => report('view error: ' + event.message));

  Homey.emit('getConfig', null)
    .then(config => {
      if (!config) return;
      $('host').value = config.host || '';
      $('port').value = config.port || 10443;
      $('username').value = config.username || '';
    })
    .catch(() => { /* No stored config yet; an empty form is correct. */ });

  function submit() {
    errorEl.textContent = '';
    button.disabled = true;

    Homey.emit('configure', {
      host: $('host').value,
      port: Number($('port').value),
      username: $('username').value,
      password: $('password').value,
    })
      .then(() => Homey.done())
      .catch(err => {
        errorEl.textContent = (err && err.message) || String(err);
        button.disabled = false;
      });
  }

  button.addEventListener('click', submit);
  document.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !button.disabled) submit();
  });
</script>
